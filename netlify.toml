# Static site — no build step. Netlify publishes the repo root as-is and
# serves /gig/ from /gig/index.html automatically.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caching. Nothing here has a hashed filename, so HTML always revalidates and
# CSS/JS stay short-TTL (stale styles against fresh HTML would break pages).
# Images change rarely under stable names — if one is ever replaced, rename it.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/gig/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/gig/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The IRL share card. Link scrapers cache aggressively anyway; rename the file
# if the artwork changes, since nothing here has a hashed filename.
[[headers]]
  for = "/irldatingshows/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The IRL admin is a private tool. It already carries a noindex meta tag; this
# says the same thing in a header, which is the version crawlers see first.
[[headers]]
  for = "/irldatingshows/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# supabase/ holds the database definition, not part of the published site. The
# root is published as-is, so serve nothing from that path — this also keeps a
# future seed file or local env dropped in there from being fetchable.
# force = true is load-bearing: without it Netlify serves the matching static
# file and never consults this rule, so schema.sql was fetchable in production.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

# Pretty source-tagged links: /gig/id=56 rewrites to the gig page (its JS reads the id from
# the path). The standard /gig/?id=56 query form needs no rule and keeps working.
[[redirects]]
  from = "/gig/id=*"
  to = "/gig/index.html"
  status = 200

# Same pretty /id= form for the campaign variant pages (see CLAUDE.md → variant pages).
[[redirects]]
  from = "/gig/pro/id=*"
  to = "/gig/pro/index.html"
  status = 200

[[redirects]]
  from = "/gig/hire/id=*"
  to = "/gig/hire/index.html"
  status = 200

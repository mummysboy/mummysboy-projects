# Static site — no build step. Netlify publishes the repo root as-is and
# serves /gig/ from /gig/index.html automatically.
#
# One exception to "everything here is static": netlify/edge-functions/geo.js, which
# answers /edge/geo with the visitor's country so the consent banner can pick the right
# privacy regime. It declares its own path via `export const config`, so there is no
# [[edge_functions]] block here — keep the path in the function file, in one place. It is
# still buildless: Deno runs the file as written, no dependencies.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caching. Nothing here has a hashed filename, so HTML always revalidates and
# CSS/JS stay short-TTL (stale styles against fresh HTML would break pages).
# Images change rarely under stable names — if one is ever replaced, rename it.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/gig/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/gig/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The video-hero variant's loops (portrait + landscape) and posters: stable names — rename on change
# (hero-loop-2.mp4), like every other image here.
[[headers]]
  for = "/gig/vid/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/gig/vid/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The Gig web demo (/gig/demo/), generated in the Gig repo by
# mobile/scripts/build-web-demo.mjs — rebuild it there, don't edit it here. On a
# computer the page shows itself inside a phone frame, so this site (and only this
# site) may frame it. CSP frame-ancestors takes precedence over the site-wide
# X-Frame-Options: DENY in current browsers; X-Frame-Options itself can't be lifted
# for one path, because Netlify would send both values.
[[headers]]
  for = "/gig/demo/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

# The demo's bundle and assets have a content hash in every filename, so they can be
# cached for good. Its index.html is left to revalidate on every load, so a rebuild
# shows up at once.
[[headers]]
  for = "/gig/demo/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gig/demo/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/rfcfinder/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The RFC Finder share card — same rename-don't-replace rule as the others.
[[headers]]
  for = "/rfcfinder/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The IRL share card. Link scrapers cache aggressively anyway; rename the file
# if the artwork changes, since nothing here has a hashed filename.
[[headers]]
  for = "/irldatingshows/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The IRL admin is a private tool. It already carries a noindex meta tag; this
# says the same thing in a header, which is the version crawlers see first.
[[headers]]
  for = "/irldatingshows/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# supabase/ holds the database definition, not part of the published site. The
# root is published as-is, so serve nothing from that path — this also keeps a
# future seed file or local env dropped in there from being fetchable.
# force = true is load-bearing: without it Netlify serves the matching static
# file and never consults this rule, so schema.sql was fetchable in production.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

# Pretty source-tagged links: /gig/id=56 rewrites to the gig page (its JS reads the id from
# the path). The standard /gig/?id=56 query form needs no rule and keeps working.
[[redirects]]
  from = "/gig/id=*"
  to = "/gig/index.html"
  status = 200

# Same pretty /id= form for the campaign variant pages (see CLAUDE.md → variant pages).
[[redirects]]
  from = "/gig/pro/id=*"
  to = "/gig/pro/index.html"
  status = 200

[[redirects]]
  from = "/gig/hire/id=*"
  to = "/gig/hire/index.html"
  status = 200

[[redirects]]
  from = "/gig/vid/id=*"
  to = "/gig/vid/index.html"
  status = 200

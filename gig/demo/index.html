    <!-- react-native-web's recommended root styles: full height, no body scroll. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- OS class set before paint — read by gig-analytics.js to tag beacons with the device. -->
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var cls = "is-desktop";
        if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) cls = "is-ios";
        else if (/Android/i.test(ua)) cls = "is-android";
        document.documentElement.classList.add(cls);
      })();
    </script>
    <!-- The landing site's consent gate, ad pixel and analytics, in the same order as on
         /gig/ (gate first). On a computer this page shows itself inside a phone frame
         (?embed=1); only the outer page loads them, so a visit counts once and the
         consent banner shows once. The demo reports its store taps through the outer
         page's window.gigTrack and window.mediagoTrackStoreClick. -->
    <script>
      (function () {
        if (/[?&]embed=1/.test(location.search)) return;
        var add = function (src, type) {
          var s = document.createElement("script");
          s.src = src;
          if (type) s.type = type;
          s.async = false;
          document.head.appendChild(s);
        };
        add("/scripts/consent.js");
        add("/scripts/mediago.js");
        add("/scripts/gig-analytics.js", "module");
      })();
    </script>
  </head>
